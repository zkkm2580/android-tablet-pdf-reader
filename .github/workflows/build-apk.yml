name: Build Android Tablet PDF Reader APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug & Signed Release APK
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Rename APKs for Easy Tablet Installation
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TabletPdfReader-v1.0.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/TabletPdfReader-v1.0.0-release.apk
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TabletPdfReader-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish Latest Release APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "平板PDF阅读器 APK (Build #${{ github.run_number }})"
          body: |
            ### 📱 安卓平板 PDF 阅读器自动构建产物
            - **适用设备**：Android 7.0 (API 24) 及以上安卓平板/手机
            - **核心功能**：
              - 📑 **多级目录（TOC）自动解析**：支持 PDF 内嵌章节树与页码搜索跳转
              - 🔖 **书签与批注管理**：按文档独立保存书签标题与阅读备注
              - ⇄ / ⇅ **左右或上下划动翻页**：顶部工具栏一键切换横向/纵向滑动翻页
              - 🔍 **双指捏合缩放 & 双击放大**：平板高清渲染 + 三种护眼主题（日间 / 羊皮纸 / 夜间）
            - **安装方式**：直接下载下方 `TabletPdfReader-v1.0.0-release.apk` 到安卓平板点击安装即可。
          files: |
            dist/TabletPdfReader-v1.0.0-release.apk
            dist/TabletPdfReader-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
